version: 2
updates:
  # The actions are pinned by commit; Dependabot moves the pin and its comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ['*'], update-types: [minor, patch] }
  # The tools of uv.lock; the package's own range of httpx is not moved by a bot.
  - package-ecosystem: uv
    directory: /
    schedule: { interval: weekly }
    # A major of httpx, of the test runner or of a type checker changes what the suite holds: it is taken by hand.
    ignore:
      - { dependency-name: httpx, update-types: ['version-update:semver-major'] }
      - { dependency-name: pytest, update-types: ['version-update:semver-major'] }
      - { dependency-name: mypy, update-types: ['version-update:semver-major'] }
      - { dependency-name: pyright, update-types: ['version-update:semver-major'] }
    groups:
      dev-tooling: { patterns: ['*'], update-types: [minor, patch] }
